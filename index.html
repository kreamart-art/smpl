<!doctype html>

    <meta charset="UTF-8" />
    <!-- Default = website: pinch-zoom allowed (WCAG AA). The installed app
         re-adds user-scalable=no below (we kill the zoom annoyances another way:
         16px inputs + touch-action:manipulation). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // In the installed app only, lock zoom (it's a native-feeling shell).
      try {
        var sp = new URLSearchParams(location.search)
        var forced = sp.get('app') || localStorage.getItem('smpl_app')
        var app =
          forced === '1' ||
          (forced !== '0' &&
            ((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
              window.navigator.standalone === true))
        if (app) {
          document
            .querySelector('meta[name=viewport]')
            .setAttribute(
              'content',
              'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover',
            )
        }
      } catch (e) {}
    </script>
